<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#064e3b">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Fidget</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    body {
      background: var(--bg, linear-gradient(135deg, #0f172a 0%, #064e3b 50%, #0f172a 100%));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white; gap: 0.7rem;
    }
    .top-bar { display: flex; gap: 0.45rem; flex-wrap: wrap; justify-content: center; padding: 0 0.75rem; }
    .chip {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); border-radius: 999px; padding: 0.35rem 0.75rem;
      font-size: 0.72rem; cursor: pointer; transition: all 0.15s;
    }
    .chip.active { background: var(--accent-dim, rgba(16,185,129,0.25)); border-color: var(--accent, #10b981); color: white; }
    .speed-display { text-align: center; min-height: 4.4rem; }
    .speed-title { color: rgba(255,255,255,0.5); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.2em; }
    .speed-label { font-size: 1.7rem; font-weight: bold; color: #64748b; transition: color 0.2s, text-shadow 0.2s; }
    .speed-label.slow { color: var(--accent-light, #34d399); }
    .speed-label.fast { color: var(--accent, #10b981); text-shadow: 0 0 20px var(--accent-glow, rgba(16,185,129,0.5)); }
    .speed-label.bad { color: #f87171; text-shadow: 0 0 16px rgba(248,113,113,0.5); }
    .rpm { color: rgba(255,255,255,0.4); font-size: 0.7rem; }
    .stage { position: relative; width: 290px; height: 290px; }
    .fidget { position: absolute; inset: 0; display: none; }
    .fidget.active { display: block; }

    /* Spinner */
    #spinnerFidget { cursor: grab; }
    #spinnerFidget:active { cursor: grabbing; }
    .glow { position: absolute; inset: 10px; border-radius: 50%; transform: scale(1.4); pointer-events: none; }
    .spinner-svg { width: 100%; height: 100%; pointer-events: none; }

    /* Scroller */
    #scrollerFidget {
      overflow: hidden; border-radius: 1.2rem; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08); cursor: grab;
      -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
      mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
    }
    #scrollerFidget:active { cursor: grabbing; }
    .scroller-strip { will-change: transform; pointer-events: none; }
    .card {
      display: flex; gap: 0.6rem; padding: 0.7rem; margin: 0.5rem 0.7rem;
      background: rgba(255,255,255,0.06); border-radius: 0.8rem;
      border: 1px solid rgba(255,255,255,0.05); height: 76px;
    }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-dim, rgba(16,185,129,0.25)); flex-shrink: 0; }
    .lines { flex: 1; padding-top: 3px; }
    .line { height: 9px; border-radius: 5px; background: rgba(255,255,255,0.12); margin-bottom: 8px; }
    .line.accent { background: var(--accent-dim, rgba(16,185,129,0.25)); }

    /* Pinch */
    #pinchFidget { display: none; align-items: center; justify-content: center; }
    #pinchFidget.active { display: flex; }
    .blob {
      width: 170px; height: 170px; border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, var(--accent-light, #34d399), var(--accent, #10b981) 55%, var(--accent-deep, #047857));
      box-shadow: 0 0 40px var(--accent-glow, rgba(16,185,129,0.4)), inset 0 -12px 24px rgba(0,0,0,0.25);
      transition: transform 0.05s linear;
    }
    .blob.spring { transition: transform 0.45s cubic-bezier(0.34, 1.8, 0.4, 1); }

    /* Maze */
    #mazeFidget { border-radius: 1rem; overflow: hidden; }
    #mazeFidget canvas { position: absolute; inset: 0; }
    #mazeCanvas { transition: opacity 0.3s; }
    #mazeCanvas.hidden { opacity: 0; }
    .maze-marker { position: absolute; font-size: 0.9rem; pointer-events: none; opacity: 0.85; }

    /* Draw + Pattern */
    #drawFidget, #patternFidget {
      border-radius: 1rem; overflow: hidden;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    }
    #drawFidget canvas, #patternFidget canvas { position: absolute; inset: 0; }

    .stats { display: flex; gap: 2rem; text-align: center; }
    .stat-label { color: rgba(255,255,255,0.4); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; }
    .stat-value { font-size: 1.15rem; font-family: ui-monospace, monospace; color: var(--accent-light, #6ee7b7); }
    .instructions { color: rgba(255,255,255,0.3); font-size: 0.78rem; text-align: center; padding: 0 1.25rem; min-height: 1.1rem; }
    .haptic-status { position: fixed; bottom: 0.5rem; left: 50%; transform: translateX(-50%); font-size: 0.65rem; color: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <div class="top-bar" id="modeBar">
    <button class="chip active" data-mode="scroll">📱 Scroller</button>
    <button class="chip" data-mode="circle">🌀 Spinner</button>
    <button class="chip" data-mode="pinch">🤏 Pinch</button>
    <button class="chip" data-mode="maze">🧩 Maze</button>
    <button class="chip" data-mode="draw">✏️ Draw</button>
    <button class="chip" data-mode="pattern">🔵 Pattern</button>
    <button class="chip" id="soundChip">🔇 Sound</button>
  </div>
  <div class="top-bar" id="shapeBar">
    <button class="chip" data-arms="2">2-arm</button>
    <button class="chip active" data-arms="3">3-arm</button>
    <button class="chip" data-arms="4">4-arm</button>
  </div>
  <div class="top-bar" id="mazeBar" style="display:none">
    <button class="chip active" id="mazeVisChip">👁 Maze visible</button>
    <button class="chip" id="mazeNewChip">🔄 New maze</button>
  </div>
  <div class="top-bar" id="patternBar" style="display:none">
    <button class="chip active" id="patFreeChip">✏️ Free</button>
    <button class="chip" id="patGuessChip">🎲 Guess</button>
    <button class="chip" id="patNewChip" style="display:none">🔄 New secret</button>
  </div>
  <div class="top-bar" id="themeBar">
    <button class="chip active" data-theme="emerald">Emerald</button>
    <button class="chip" data-theme="purple">Amethyst</button>
    <button class="chip" data-theme="crimson">Crimson</button>
    <button class="chip" data-theme="sapphire">Sapphire</button>
  </div>

  <div class="speed-display">
    <div class="speed-title" id="speedTitle">Speed</div>
    <div class="speed-label" id="speedLabel">Stopped</div>
    <div class="rpm" id="rpm">0 RPM</div>
  </div>

  <div class="stage">
    <div class="fidget" id="spinnerFidget">
      <div class="glow" id="glow"></div>
      <svg class="spinner-svg" id="spinner" viewBox="-100 -100 200 200">
        <defs>
          <radialGradient id="armG" cx="30%" cy="30%">
            <stop id="armS1" offset="0%" stop-color="#34d399" /><stop id="armS2" offset="100%" stop-color="#047857" />
          </radialGradient>
          <radialGradient id="bearingG" cx="30%" cy="30%">
            <stop id="brgS1" offset="0%" stop-color="#6ee7b7" /><stop id="brgS2" offset="100%" stop-color="#059669" />
          </radialGradient>
          <radialGradient id="centerG" cx="30%" cy="30%">
            <stop id="ctrS1" offset="0%" stop-color="#10b981" /><stop id="ctrS2" offset="100%" stop-color="#047857" />
          </radialGradient>
          <radialGradient id="innerG" cx="30%" cy="30%">
            <stop offset="0%" stop-color="#94a3b8" /><stop offset="100%" stop-color="#475569" />
          </radialGradient>
        </defs>
        <g id="spinnerGroup"></g>
      </svg>
    </div>

    <div class="fidget active" id="scrollerFidget">
      <div class="scroller-strip" id="scrollerStrip"></div>
    </div>

    <div class="fidget" id="pinchFidget">
      <div class="blob" id="blob"></div>
    </div>

    <div class="fidget" id="mazeFidget">
      <canvas id="mazeCanvas" width="290" height="290"></canvas>
      <canvas id="trailCanvas" width="290" height="290"></canvas>
      <div class="maze-marker" id="startMarker">🟢</div>
      <div class="maze-marker" id="exitMarker">🏁</div>
    </div>

    <div class="fidget" id="drawFidget">
      <canvas id="drawCanvas" width="290" height="290"></canvas>
    </div>

    <div class="fidget" id="patternFidget">
      <canvas id="patternCanvas" width="290" height="290"></canvas>
    </div>
  </div>

  <div class="stats">
    <div><div class="stat-label" id="stat1Label">Posts</div><div class="stat-value" id="stat1Value">0</div></div>
    <div><div class="stat-label">Best RPM</div><div class="stat-value" id="bestRpm">0</div></div>
    <div><div class="stat-label">Longest</div><div class="stat-value" id="bestTime">0s</div></div>
  </div>

  <div class="instructions" id="instructions"></div>
  <div class="haptic-status" id="hapticStatus"></div>

  <script>
    // ---------- Themes ----------
    const THEMES = {
      emerald:  { stroke1:'#064e3b', stroke2:'#065f46', arm:['#34d399','#047857'], brg:['#6ee7b7','#059669'], ctr:['#10b981','#047857'], accent:'#10b981', accentLight:'#34d399', deep:'#047857', glow:'16,185,129', bg:'linear-gradient(135deg,#0f172a 0%,#064e3b 50%,#0f172a 100%)' },
      purple:   { stroke1:'#312e81', stroke2:'#3730a3', arm:['#a78bfa','#6d28d9'], brg:['#c4b5fd','#7c3aed'], ctr:['#8b5cf6','#5b21b6'], accent:'#8b5cf6', accentLight:'#a78bfa', deep:'#5b21b6', glow:'139,92,246',  bg:'linear-gradient(135deg,#0f172a 0%,#2e1065 50%,#0f172a 100%)' },
      crimson:  { stroke1:'#7f1d1d', stroke2:'#991b1b', arm:['#f87171','#b91c1c'], brg:['#fca5a5','#dc2626'], ctr:['#ef4444','#991b1b'], accent:'#ef4444', accentLight:'#f87171', deep:'#991b1b', glow:'239,68,68',   bg:'linear-gradient(135deg,#0f172a 0%,#450a0a 50%,#0f172a 100%)' },
      sapphire: { stroke1:'#1e3a8a', stroke2:'#1e40af', arm:['#60a5fa','#1d4ed8'], brg:['#93c5fd','#2563eb'], ctr:['#3b82f6','#1e40af'], accent:'#3b82f6', accentLight:'#60a5fa', deep:'#1e40af', glow:'59,130,246',  bg:'linear-gradient(135deg,#0f172a 0%,#172554 50%,#0f172a 100%)' }
    };

    // ---------- State ----------
    let rotation = 0, velocity = 0, dragging = false;
    let mode = 'scroll';
    let arms = 3, theme = 'emerald', soundOn = false;
    let lastAngle = 0, lastY = 0;
    let recent = [];
    let spinCount = 0, postCount = 0, squeezeCount = 0, mazeCount = 0, strokeCount = 0, patternCount = 0;
    let lastCounted = 0, lastHaptic = 0, lastCardTick = 0;
    let spinStartTime = 0;
    let best = { rpm: 0, time: 0 };
    const hasHaptics = 'vibrate' in navigator;
    const PX_PER_DEG = 2.2;
    let stripH = 1, cardH = 92;

    try {
      const s = JSON.parse(localStorage.getItem('fidget-data') || '{}');
      if (s.best) best = s.best;
      spinCount = s.spinCount || 0; postCount = s.postCount || 0;
      squeezeCount = s.squeezeCount || 0; mazeCount = s.mazeCount || 0;
      strokeCount = s.strokeCount || 0; patternCount = s.patternCount || 0;
      if (s.theme && THEMES[s.theme]) theme = s.theme;
      if (s.arms) arms = s.arms;
      if (s.mode) mode = s.mode;
    } catch (e) {}

    function save() {
      try { localStorage.setItem('fidget-data', JSON.stringify({ best, spinCount, postCount, squeezeCount, mazeCount, strokeCount, patternCount, theme, arms, mode })); } catch (e) {}
    }

    // ---------- Elements ----------
    const $ = id => document.getElementById(id);
    const spinBox = $('spinnerFidget'), scrollBox = $('scrollerFidget');
    const pinchBox = $('pinchFidget'), mazeBox = $('mazeFidget');
    const drawBox = $('drawFidget'), patternBox = $('patternFidget');
    const group = $('spinnerGroup'), glow = $('glow'), strip = $('scrollerStrip'), blob = $('blob');

    $('hapticStatus').textContent = hasHaptics ? '✓ Haptics enabled' : '✗ Haptics unavailable on this browser';
    function vibrate(p) { if (hasHaptics) { try { navigator.vibrate(p); } catch (e) {} } }

    // ---------- Sound ----------
    let audioCtx = null, osc = null, gain = null;
    function initAudio() {
      if (audioCtx) return;
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator(); osc.type = 'triangle';
        gain = audioCtx.createGain(); gain.gain.value = 0;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start();
      } catch (e) {}
    }
    function updateSound(speed) {
      if (!audioCtx || !soundOn) { if (gain) gain.gain.value = 0; return; }
      const s = Math.min(speed, 40);
      gain.gain.setTargetAtTime(s > 0.3 ? Math.min(s / 200, 0.06) : 0, audioCtx.currentTime, 0.05);
      osc.frequency.setTargetAtTime(40 + s * 6, audioCtx.currentTime, 0.05);
    }

    // ---------- Spinner ----------
    function buildSpinner() {
      const t = THEMES[theme];
      let svg = '';
      for (let i = 0; i < arms; i++) {
        svg += `<g transform="rotate(${(360/arms)*i})">
          <ellipse cx="45" cy="0" rx="38" ry="22" fill="url(#armG)" stroke="${t.stroke1}" stroke-width="2"/>
          <circle cx="70" cy="0" r="18" fill="url(#bearingG)" stroke="${t.stroke2}" stroke-width="2"/>
          <circle cx="70" cy="0" r="10" fill="${t.stroke1}"/>
          <circle cx="70" cy="0" r="6" fill="#374151"/>
        </g>`;
      }
      svg += `<circle cx="0" cy="0" r="24" fill="url(#centerG)" stroke="${t.stroke2}" stroke-width="3"/>
        <circle cx="0" cy="0" r="14" fill="${t.stroke1}"/>
        <circle cx="0" cy="0" r="8" fill="url(#innerG)"/>`;
      group.innerHTML = svg;
    }

    // ---------- Scroller ----------
    function buildScroller() {
      const widths = [[85, 60, 40], [70, 90, 0], [55, 75, 35], [95, 45, 0], [65, 80, 50], [75, 55, 0]];
      let cards = '';
      for (const w of widths) {
        cards += `<div class="card"><div class="avatar"></div><div class="lines">
          <div class="line" style="width:${w[0]}%"></div>
          <div class="line accent" style="width:${w[1]}%"></div>
          ${w[2] ? `<div class="line" style="width:${w[2]}%"></div>` : ''}
        </div></div>`;
      }
      strip.innerHTML = cards + cards;
      stripH = strip.scrollHeight / 2;
      cardH = stripH / widths.length;
    }

    function countPosts(withHaptics) {
      const cardIdx = Math.floor((rotation * PX_PER_DEG) / cardH);
      if (cardIdx !== lastCardTick) {
        postCount += Math.abs(cardIdx - lastCardTick);
        lastCardTick = cardIdx;
        if (withHaptics) vibrate(6);
      }
    }

    // ---------- Pinch ----------
    let pinchStartDist = 0, pinchStartY = 0, squeeze = 0, maxSqueeze = 0, lastPinchThresh = 0;
    const PINCH_THRESHOLDS = [0.25, 0.5, 0.75, 0.95];

    function setSqueeze(q) {
      squeeze = Math.max(0, Math.min(1, q));
      if (squeeze > maxSqueeze) maxSqueeze = squeeze;
      blob.classList.remove('spring');
      blob.style.transform = `scale(${1 - squeeze * 0.38}, ${1 + squeeze * 0.22})`;
      // Escalating haptics at squeeze thresholds
      for (let i = 0; i < PINCH_THRESHOLDS.length; i++) {
        if (squeeze >= PINCH_THRESHOLDS[i] && lastPinchThresh <= i) {
          vibrate(6 + i * 8);
          lastPinchThresh = i + 1;
        }
      }
      if (squeeze < (PINCH_THRESHOLDS[Math.max(0, lastPinchThresh - 1)] || 0) - 0.12) lastPinchThresh = Math.max(0, lastPinchThresh - 1);
      const sl = $('speedLabel');
      if (squeeze < 0.05)      { sl.textContent = 'Relaxed';   sl.className = 'speed-label'; }
      else if (squeeze < 0.4)  { sl.textContent = 'Soft';      sl.className = 'speed-label slow'; }
      else if (squeeze < 0.75) { sl.textContent = 'Firm';      sl.className = 'speed-label slow'; }
      else                     { sl.textContent = 'SQUISHED!'; sl.className = 'speed-label fast'; }
      $('rpm').textContent = `${Math.round(squeeze * 100)}% squeeze`;
    }

    function releasePinch() {
      if (maxSqueeze > 0.5) { squeezeCount++; updateStats(); save(); }
      blob.classList.add('spring');
      blob.style.transform = 'scale(1, 1)';
      if (maxSqueeze > 0.2) vibrate([8, 40, 14, 40, 6]);   // springy bounce
      squeeze = 0; maxSqueeze = 0; lastPinchThresh = 0;
      setTimeout(() => { if (mode === 'pinch') setSqueeze(0); }, 60);
    }

    // ---------- Maze ----------
    const MZ = 7, MSIZE = 290, MCELL = MSIZE / MZ, WALL = 7;
    let maze = null, mazeData = null, mazeVisible = true;
    let onWall = false, lastWallBuzz = 0, lastMazeCell = -1, mazeStarted = false;
    const mazeCanvas = $('mazeCanvas'), trailCanvas = $('trailCanvas');
    const mctx = mazeCanvas.getContext('2d'), tctx = trailCanvas.getContext('2d');

    function genMaze() {
      const right = Array.from({length: MZ}, () => Array(MZ).fill(true));
      const bottom = Array.from({length: MZ}, () => Array(MZ).fill(true));
      const visited = Array.from({length: MZ}, () => Array(MZ).fill(false));
      const stack = [[0, 0]]; visited[0][0] = true;
      while (stack.length) {
        const [x, y] = stack[stack.length - 1];
        const nbrs = [];
        if (x > 0 && !visited[y][x-1]) nbrs.push([x-1, y, 'L']);
        if (x < MZ-1 && !visited[y][x+1]) nbrs.push([x+1, y, 'R']);
        if (y > 0 && !visited[y-1][x]) nbrs.push([x, y-1, 'U']);
        if (y < MZ-1 && !visited[y+1][x]) nbrs.push([x, y+1, 'D']);
        if (!nbrs.length) { stack.pop(); continue; }
        const [nx, ny, dir] = nbrs[Math.floor(Math.random() * nbrs.length)];
        if (dir === 'R') right[y][x] = false;
        if (dir === 'L') right[ny][nx] = false;
        if (dir === 'D') bottom[y][x] = false;
        if (dir === 'U') bottom[ny][nx] = false;
        visited[ny][nx] = true; stack.push([nx, ny]);
      }
      return { right, bottom };
    }

    function drawMaze() {
      const t = THEMES[theme];
      mctx.clearRect(0, 0, MSIZE, MSIZE);
      mctx.strokeStyle = t.accent;
      mctx.globalAlpha = 0.85;
      mctx.lineWidth = WALL;
      mctx.lineCap = 'round';
      mctx.beginPath();
      // Border (gap at top-left entrance and bottom-right exit)
      mctx.moveTo(MCELL, WALL/2); mctx.lineTo(MSIZE - WALL/2, WALL/2);                 // top, skip first cell
      mctx.moveTo(WALL/2, WALL/2); mctx.lineTo(WALL/2, MSIZE - WALL/2);                // left
      mctx.moveTo(MSIZE - WALL/2, WALL/2); mctx.lineTo(MSIZE - WALL/2, MSIZE - WALL/2);// right
      mctx.moveTo(WALL/2, MSIZE - WALL/2); mctx.lineTo(MSIZE - MCELL, MSIZE - WALL/2); // bottom, skip last cell
      // Inner walls
      for (let y = 0; y < MZ; y++) {
        for (let x = 0; x < MZ; x++) {
          if (maze.right[y][x] && x < MZ-1) {
            mctx.moveTo((x+1)*MCELL, y*MCELL); mctx.lineTo((x+1)*MCELL, (y+1)*MCELL);
          }
          if (maze.bottom[y][x] && y < MZ-1) {
            mctx.moveTo(x*MCELL, (y+1)*MCELL); mctx.lineTo((x+1)*MCELL, (y+1)*MCELL);
          }
        }
      }
      mctx.stroke();
      mctx.globalAlpha = 1;
      mazeData = mctx.getImageData(0, 0, MSIZE, MSIZE);
      tctx.clearRect(0, 0, MSIZE, MSIZE);
      // markers
      $('startMarker').style.left = (MCELL/2 - 9) + 'px'; $('startMarker').style.top = '2px';
      $('exitMarker').style.left = (MSIZE - MCELL/2 - 9) + 'px'; $('exitMarker').style.top = (MSIZE - 24) + 'px';
      lastMazeCell = -1; mazeStarted = false;
    }

    function newMaze() { maze = genMaze(); drawMaze(); }

    // ---------- Draw (fading ink doodle) ----------
    const drawCanvas = $('drawCanvas'), dctx = drawCanvas.getContext('2d');
    let drawLast = null, drawDist = 0, drewSomething = false;

    function drawTouch(x, y, isStart) {
      const r = drawBox.getBoundingClientRect();
      const dx = x - r.left, dy = y - r.top;
      const t = THEMES[theme];
      if (isStart) { drawLast = [dx, dy]; drewSomething = false; vibrate(6); return; }
      if (!drawLast) { drawLast = [dx, dy]; return; }
      dctx.strokeStyle = t.accentLight;
      dctx.lineWidth = 5; dctx.lineCap = 'round';
      dctx.shadowColor = t.accent; dctx.shadowBlur = 12;
      dctx.globalAlpha = 0.9;
      dctx.beginPath(); dctx.moveTo(drawLast[0], drawLast[1]); dctx.lineTo(dx, dy); dctx.stroke();
      dctx.shadowBlur = 0; dctx.globalAlpha = 1;
      drawDist += Math.hypot(dx - drawLast[0], dy - drawLast[1]);
      if (drawDist > 26) { vibrate(3); drawDist = 0; }   // pen-on-paper texture
      drewSomething = true;
      drawLast = [dx, dy];
    }

    function drawEnd() {
      if (drewSomething) { strokeCount++; updateStats(); save(); }
      drawLast = null; drewSomething = false;
    }

    // ---------- Pattern (unlock dots) ----------
    const patternCanvas = $('patternCanvas'), pctx = patternCanvas.getContext('2d');
    const PDOTS = [];
    for (let ry = 0; ry < 3; ry++) for (let cx = 0; cx < 3; cx++) PDOTS.push({ x: 55 + cx * 90, y: 55 + ry * 90 });
    let pSel = [], pCur = null;
    let patternGuess = false, secret = [], lastWrongBuzz = 0;

    // Random secret: a walk to adjacent dots (incl. diagonals), 4-6 long
    function genSecret() {
      while (true) {
        const visited = new Set();
        let cur = Math.floor(Math.random() * 9);
        visited.add(cur);
        const seq = [cur];
        const target = 4 + Math.floor(Math.random() * 3);
        while (seq.length < target) {
          const r = Math.floor(cur / 3), c = cur % 3;
          const nbrs = [];
          for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc, ni = nr * 3 + nc;
            if (nr >= 0 && nr < 3 && nc >= 0 && nc < 3 && !visited.has(ni)) nbrs.push(ni);
          }
          if (!nbrs.length) break;
          cur = nbrs[Math.floor(Math.random() * nbrs.length)];
          visited.add(cur); seq.push(cur);
        }
        if (seq.length >= 4) { secret = seq; return; }
      }
    }

    function updatePatternUI() {
      $('patFreeChip').classList.toggle('active', !patternGuess);
      $('patGuessChip').classList.toggle('active', patternGuess);
      $('patNewChip').style.display = patternGuess ? '' : 'none';
      $('instructions').textContent = patternGuess
        ? 'A secret pattern is hidden — tick = right dot, buzz = wrong. Crack it by feel'
        : 'Connect the dots, like unlocking your phone';
      $('rpm').textContent = patternGuess ? `${pSel.length} / ${secret.length} found` : 'muscle memory time';
    }

    function drawPattern() {
      pctx.clearRect(0, 0, 290, 290);
      const t = THEMES[theme];
      pctx.strokeStyle = t.accent; pctx.lineWidth = 5; pctx.lineCap = 'round'; pctx.globalAlpha = 0.9;
      pctx.beginPath();
      pSel.forEach((i, k) => { const p = PDOTS[i]; k ? pctx.lineTo(p.x, p.y) : pctx.moveTo(p.x, p.y); });
      if (pSel.length && pCur) pctx.lineTo(pCur[0], pCur[1]);
      pctx.stroke(); pctx.globalAlpha = 1;
      PDOTS.forEach((p, i) => {
        const sel = pSel.includes(i);
        pctx.beginPath(); pctx.arc(p.x, p.y, sel ? 13 : 9, 0, Math.PI * 2);
        pctx.fillStyle = sel ? t.accentLight : 'rgba(255,255,255,0.25)';
        if (sel) { pctx.shadowColor = t.accent; pctx.shadowBlur = 14; }
        pctx.fill(); pctx.shadowBlur = 0;
      });
    }

    function patternTouch(x, y, isStart) {
      const r = patternBox.getBoundingClientRect();
      const px = x - r.left, py = y - r.top;
      pCur = [px, py];
      if (isStart) {
        if (!patternGuess) pSel = [];   // guess mode keeps progress across lifts
        vibrate(6);
      }
      PDOTS.forEach((p, i) => {
        if (!pSel.includes(i) && Math.hypot(px - p.x, py - p.y) < 27) {
          if (!patternGuess) {
            pSel.push(i);
            vibrate(14);                          // satisfying snap per dot
          } else if (i === secret[pSel.length]) {
            pSel.push(i);
            vibrate(9);                           // gentle = right dot
            if (pSel.length === secret.length) {
              patternCount++; updateStats(); save();
              vibrate([20, 50, 20, 50, 70]);      // cracked it!
              $('speedLabel').textContent = 'CRACKED!';
              $('speedLabel').className = 'speed-label fast';
              setTimeout(() => {
                genSecret(); pSel = []; drawPattern();
                if (mode === 'pattern') {
                  $('speedLabel').textContent = 'Ready';
                  $('speedLabel').className = 'speed-label';
                  updatePatternUI();
                }
              }, 700);
            }
          } else {
            const now = performance.now();
            if (now - lastWrongBuzz > 200) { vibrate(32); lastWrongBuzz = now; }   // harsh = wrong dot
          }
        }
      });
      if (patternGuess) $('rpm').textContent = `${pSel.length} / ${secret.length} found`;
      else $('rpm').textContent = pSel.length ? `${pSel.length} dots` : 'muscle memory time';
      drawPattern();
    }

    function patternEnd() {
      if (!patternGuess) {
        if (pSel.length >= 3) {
          patternCount++; updateStats(); save();
          vibrate([10, 40, 10]);
        }
        pSel = [];
        $('rpm').textContent = 'muscle memory time';
      }
      pCur = null;
      drawPattern();
    }

    function sampleWall(x, y) {
      if (!mazeData) return false;
      const px = Math.round(x), py = Math.round(y);
      if (px < 0 || py < 0 || px >= MSIZE || py >= MSIZE) return false;
      return mazeData.data[(py * MSIZE + px) * 4 + 3] > 60;   // alpha of wall stroke
    }

    function mazeTouch(x, y) {
      const r = mazeBox.getBoundingClientRect();
      const mx = x - r.left, my = y - r.top;
      if (mx < 0 || my < 0 || mx > MSIZE || my > MSIZE) return;

      // Trail dot
      const t = THEMES[theme];
      tctx.fillStyle = t.accentLight;
      tctx.globalAlpha = 0.5;
      tctx.beginPath(); tctx.arc(mx, my, 4, 0, Math.PI * 2); tctx.fill();
      tctx.globalAlpha = 1;

      const hit = sampleWall(mx, my);
      const sl = $('speedLabel');
      if (hit) {
        const now = performance.now();
        if (now - lastWallBuzz > 90) { vibrate(28); lastWallBuzz = now; }   // harsh = off track
        sl.textContent = 'Wall!'; sl.className = 'speed-label bad';
        $('rpm').textContent = 'back up and feel around';
        onWall = true;
      } else {
        const cx = Math.floor(mx / MCELL), cy = Math.floor(my / MCELL);
        const cellIdx = cy * MZ + cx;
        if (cellIdx !== lastMazeCell) {
          vibrate(3);                                        // gentle = on track
          lastMazeCell = cellIdx;
        }
        if (cx === 0 && cy === 0) mazeStarted = true;
        sl.textContent = 'On track'; sl.className = 'speed-label slow';
        $('rpm').textContent = mazeVisible ? 'find the exit' : 'find the exit by feel';
        onWall = false;
        // Win: reach bottom-right cell (after having touched the start)
        if (mazeStarted && cx === MZ-1 && cy === MZ-1) {
          mazeCount++; updateStats(); save();
          vibrate([30, 60, 30, 60, 80]);                     // celebration
          sl.textContent = 'ESCAPED!'; sl.className = 'speed-label fast';
          setTimeout(newMaze, 500);
        }
      }
    }

    // ---------- Mode / theme ----------
    function applyMode() {
      spinBox.classList.toggle('active', mode === 'circle');
      scrollBox.classList.toggle('active', mode === 'scroll');
      pinchBox.classList.toggle('active', mode === 'pinch');
      mazeBox.classList.toggle('active', mode === 'maze');
      drawBox.classList.toggle('active', mode === 'draw');
      patternBox.classList.toggle('active', mode === 'pattern');
      $('shapeBar').style.display = mode === 'circle' ? '' : 'none';
      $('mazeBar').style.display = mode === 'maze' ? '' : 'none';
      $('patternBar').style.display = mode === 'pattern' ? '' : 'none';
      const labels = { scroll: 'Posts', circle: 'Spins', pinch: 'Squeezes', maze: 'Mazes', draw: 'Strokes', pattern: 'Patterns' };
      $('stat1Label').textContent = labels[mode];
      const instr = {
        scroll: 'Flick through the endless empty feed — hold to stop',
        circle: 'Drag the spinner in a circle and release',
        pinch: 'Pinch with two fingers and squeeze the blob',
        maze: 'Start at 🟢, trace to 🏁 — gentle tick on path, buzz on walls',
        draw: 'Doodle with your finger — the ink slowly fades away',
        pattern: 'Connect the dots, like unlocking your phone'
      };
      $('instructions').textContent = instr[mode];
      const titles = { scroll: 'Speed', circle: 'Speed', pinch: 'Squeeze', maze: 'Feel', draw: 'Draw', pattern: 'Pattern' };
      $('speedTitle').textContent = titles[mode];
      document.querySelectorAll('#modeBar [data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      if (mode === 'pinch') setSqueeze(0);
      if (mode === 'maze') { $('speedLabel').textContent = 'Ready'; $('speedLabel').className = 'speed-label'; $('rpm').textContent = 'touch the maze to begin'; }
      if (mode === 'draw') { $('speedLabel').textContent = 'Canvas'; $('speedLabel').className = 'speed-label slow'; $('rpm').textContent = 'ink fades as you go'; }
      if (mode === 'pattern') { $('speedLabel').textContent = 'Ready'; $('speedLabel').className = 'speed-label'; updatePatternUI(); drawPattern(); }
      if (mode === 'scroll' || mode === 'circle') { $('speedLabel').textContent = 'Stopped'; $('speedLabel').className = 'speed-label'; $('rpm').textContent = '0 RPM'; }
      updateStats();
    }

    function applyTheme() {
      const t = THEMES[theme];
      $('armS1').setAttribute('stop-color', t.arm[0]);  $('armS2').setAttribute('stop-color', t.arm[1]);
      $('brgS1').setAttribute('stop-color', t.brg[0]);  $('brgS2').setAttribute('stop-color', t.brg[1]);
      $('ctrS1').setAttribute('stop-color', t.ctr[0]);  $('ctrS2').setAttribute('stop-color', t.ctr[1]);
      document.body.style.setProperty('--accent', t.accent);
      document.body.style.setProperty('--accent-light', t.accentLight);
      document.body.style.setProperty('--accent-deep', t.deep);
      document.body.style.setProperty('--accent-dim', `rgba(${t.glow},0.25)`);
      document.body.style.setProperty('--accent-glow', `rgba(${t.glow},0.5)`);
      document.body.style.background = t.bg;
      buildSpinner();
      if (maze) drawMaze();
      drawPattern();
    }

    // ---------- Display ----------
    function updateStats() {
      const vals = { scroll: postCount, circle: spinCount, pinch: squeezeCount, maze: mazeCount, draw: strokeCount, pattern: patternCount };
      $('stat1Value').textContent = vals[mode].toLocaleString();
      $('bestRpm').textContent = best.rpm.toLocaleString();
      $('bestTime').textContent = best.time.toFixed(1) + 's';
    }

    function updateMotion() {
      const speed = Math.abs(velocity);
      const rpm = Math.round(speed * 20);
      const t = THEMES[theme];
      if (mode === 'circle') {
        group.setAttribute('transform', `rotate(${rotation})`);
        const gi = Math.min(rpm / 200, 1);
        glow.style.background = `radial-gradient(circle, rgba(${t.glow}, ${gi * 0.5}) 0%, transparent 70%)`;
        $('spinner').style.filter = rpm > 150 ? `drop-shadow(0 0 ${rpm/15}px rgba(${t.glow},0.6))` : 'none';
      } else if (mode === 'scroll') {
        const px = rotation * PX_PER_DEG;
        const off = ((px % stripH) + stripH) % stripH;
        strip.style.transform = `translateY(${-off}px)`;
      }
      const sl = $('speedLabel');
      if (rpm < 10)      { sl.textContent = 'Stopped';  sl.className = 'speed-label'; }
      else if (rpm < 50) { sl.textContent = 'Slow';     sl.className = 'speed-label slow'; }
      else if (rpm < 150){ sl.textContent = 'Medium';   sl.className = 'speed-label slow'; }
      else if (rpm < 300){ sl.textContent = 'Fast';     sl.className = 'speed-label fast'; }
      else               { sl.textContent = 'BLAZING!'; sl.className = 'speed-label fast'; }
      $('rpm').textContent = `${rpm} RPM`;
      updateStats();
    }

    // ---------- Physics loop (scroller + spinner) + draw fading ----------
    function tick() {
      if (mode === 'draw') {
        // Ink slowly evaporates
        dctx.globalCompositeOperation = 'destination-out';
        dctx.fillStyle = 'rgba(0,0,0,0.035)';
        dctx.fillRect(0, 0, 290, 290);
        dctx.globalCompositeOperation = 'source-over';
      }
      if ((mode === 'scroll' || mode === 'circle') && !dragging && Math.abs(velocity) > 0.01) {
        velocity *= 0.987;
        rotation += velocity;
        const rpm = Math.round(Math.abs(velocity) * 20);
        if (rpm > best.rpm) best.rpm = rpm;
        if (mode === 'circle') {
          const fullSpins = Math.floor(Math.abs(rotation - lastCounted) / 360);
          if (fullSpins > 0) {
            spinCount += fullSpins;
            lastCounted += fullSpins * 360 * Math.sign(rotation - lastCounted);
            vibrate(18);
          }
          if (Math.abs(velocity) > 3 && Math.abs(rotation - lastHaptic) >= 30) { vibrate(3); lastHaptic = rotation; }
        } else {
          countPosts(true);
        }
        updateSound(Math.abs(velocity));
        updateMotion();
      } else if ((mode === 'scroll' || mode === 'circle') && !dragging && velocity !== 0) {
        velocity = 0;
        if (spinStartTime) {
          const dur = (performance.now() - spinStartTime) / 1000;
          if (dur > best.time) best.time = dur;
          spinStartTime = 0;
          save();
        }
        updateSound(0);
        updateMotion();
      }
      requestAnimationFrame(tick);
    }

    // ---------- Input ----------
    function getAngle(x, y) {
      const r = spinBox.getBoundingClientRect();
      return Math.atan2(y - (r.top + r.height/2), x - (r.left + r.width/2)) * 180 / Math.PI;
    }

    function start(x, y) {
      initAudio();
      dragging = true; recent = [];
      if (mode === 'circle') velocity = 0;
      lastAngle = getAngle(x, y); lastY = y;
      vibrate(10);
    }

    function move(x, y) {
      if (!dragging) return;
      let delta;
      if (mode === 'circle') {
        const a = getAngle(x, y);
        delta = a - lastAngle;
        if (delta > 180) delta -= 360;
        if (delta < -180) delta += 360;
        lastAngle = a;
      } else {
        delta = (lastY - y) * 0.9;
        lastY = y;
      }
      rotation += delta;
      recent.push(delta);
      if (recent.length > 5) recent.shift();
      if (mode === 'scroll') countPosts(true);
      updateMotion();
    }

    function end() {
      if (!dragging) return;
      dragging = false;
      if (recent.length) {
        const avg = recent.reduce((a,b) => a+b, 0) / recent.length;
        if (mode === 'scroll') {
          if (Math.abs(avg) < 0.5) velocity = 0;
          else velocity = Math.max(-60, Math.min(60, velocity + avg * 1.8));
        } else {
          velocity = avg * 1.5;
        }
        const s = Math.abs(velocity);
        if (s > 0.5 && !spinStartTime) spinStartTime = performance.now();
        if (s > 10) vibrate([5,30,5,30,10]);
        else if (s > 5) vibrate([5,20,8]);
      }
    }

    function touchDist(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    // Touch
    document.body.addEventListener('touchstart', e => {
      if (e.target.closest('.chip')) return;
      e.preventDefault();
      initAudio();
      if (mode === 'pinch') {
        if (e.touches.length >= 2) { pinchStartDist = touchDist(e); }
        else { pinchStartY = e.touches[0].clientY; }
        vibrate(8);
      } else if (mode === 'maze') {
        mazeTouch(e.touches[0].clientX, e.touches[0].clientY);
      } else if (mode === 'draw') {
        drawTouch(e.touches[0].clientX, e.touches[0].clientY, true);
      } else if (mode === 'pattern') {
        patternTouch(e.touches[0].clientX, e.touches[0].clientY, true);
      } else if (mode === 'circle') {
        const t = e.touches[0];
        if (spinBox.contains(e.target) || e.target === spinBox) start(t.clientX, t.clientY);
      } else {
        const t = e.touches[0];
        start(t.clientX, t.clientY);
      }
    }, { passive: false });

    document.body.addEventListener('touchmove', e => {
      e.preventDefault();
      if (mode === 'pinch') {
        if (e.touches.length >= 2) {
          if (!pinchStartDist) pinchStartDist = touchDist(e);
          setSqueeze((pinchStartDist - touchDist(e)) / (pinchStartDist * 0.65));
        } else {
          setSqueeze((e.touches[0].clientY - pinchStartY) / 170);   // one-finger fallback: drag down
        }
      } else if (mode === 'maze') {
        mazeTouch(e.touches[0].clientX, e.touches[0].clientY);
      } else if (mode === 'draw') {
        drawTouch(e.touches[0].clientX, e.touches[0].clientY, false);
      } else if (mode === 'pattern') {
        patternTouch(e.touches[0].clientX, e.touches[0].clientY, false);
      } else if (dragging) {
        const t = e.touches[0];
        move(t.clientX, t.clientY);
      }
    }, { passive: false });

    document.body.addEventListener('touchend', e => {
      if (mode === 'pinch') {
        if (e.touches.length === 0) releasePinch();
        else pinchStartDist = 0;   // went from 2 fingers to 1: re-anchor
      } else if (mode === 'maze') {
        // lifting finger just pauses; nothing to do
      } else if (mode === 'draw') {
        drawEnd();
      } else if (mode === 'pattern') {
        patternEnd();
      } else {
        end();
      }
    }, { passive: false });

    // Mouse (desktop fallback)
    document.body.addEventListener('mousedown', e => {
      if (e.target.closest('.chip')) return;
      e.preventDefault(); initAudio();
      if (mode === 'pinch') { pinchStartY = e.clientY; dragging = true; }
      else if (mode === 'maze') { dragging = true; mazeTouch(e.clientX, e.clientY); }
      else if (mode === 'draw') { dragging = true; drawTouch(e.clientX, e.clientY, true); }
      else if (mode === 'pattern') { dragging = true; patternTouch(e.clientX, e.clientY, true); }
      else if (mode === 'circle') { if (spinBox.contains(e.target) || e.target === spinBox) start(e.clientX, e.clientY); }
      else start(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', e => {
      if (mode === 'pinch' && dragging) setSqueeze((e.clientY - pinchStartY) / 170);
      else if (mode === 'maze' && dragging) mazeTouch(e.clientX, e.clientY);
      else if (mode === 'draw' && dragging) drawTouch(e.clientX, e.clientY, false);
      else if (mode === 'pattern' && dragging) patternTouch(e.clientX, e.clientY, false);
      else move(e.clientX, e.clientY);
    });
    window.addEventListener('mouseup', () => {
      if (mode === 'pinch' && dragging) { dragging = false; releasePinch(); }
      else if (mode === 'maze') dragging = false;
      else if (mode === 'draw') { if (dragging) { dragging = false; drawEnd(); } }
      else if (mode === 'pattern') { if (dragging) { dragging = false; patternEnd(); } }
      else end();
    });

    // ---------- Controls ----------
    $('modeBar').addEventListener('click', e => {
      const btn = e.target.closest('[data-mode]');
      if (!btn) return;
      mode = btn.dataset.mode;
      velocity = 0;
      lastCardTick = Math.floor((rotation * PX_PER_DEG) / cardH);
      lastCounted = rotation;
      applyMode(); vibrate(8); save();
    });

    $('soundChip').addEventListener('click', () => {
      initAudio();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      soundOn = !soundOn;
      $('soundChip').textContent = soundOn ? '🔊 Sound' : '🔇 Sound';
      $('soundChip').classList.toggle('active', soundOn);
      vibrate(8);
    });

    $('shapeBar').addEventListener('click', e => {
      const btn = e.target.closest('[data-arms]');
      if (!btn) return;
      arms = parseInt(btn.dataset.arms);
      document.querySelectorAll('#shapeBar .chip').forEach(b => b.classList.toggle('active', b === btn));
      buildSpinner(); vibrate(8); save();
    });

    $('themeBar').addEventListener('click', e => {
      const btn = e.target.closest('[data-theme]');
      if (!btn) return;
      theme = btn.dataset.theme;
      document.querySelectorAll('#themeBar .chip').forEach(b => b.classList.toggle('active', b === btn));
      applyTheme(); vibrate(8); save();
    });

    $('mazeVisChip').addEventListener('click', () => {
      mazeVisible = !mazeVisible;
      mazeCanvas.classList.toggle('hidden', !mazeVisible);
      $('mazeVisChip').textContent = mazeVisible ? '👁 Maze visible' : '🙈 Maze hidden';
      $('mazeVisChip').classList.toggle('active', mazeVisible);
      vibrate(8);
    });

    $('mazeNewChip').addEventListener('click', () => { newMaze(); vibrate(8); });

    $('patFreeChip').addEventListener('click', () => {
      patternGuess = false; pSel = []; drawPattern(); updatePatternUI(); vibrate(8);
    });
    $('patGuessChip').addEventListener('click', () => {
      patternGuess = true; pSel = []; genSecret(); drawPattern(); updatePatternUI(); vibrate(8);
    });
    $('patNewChip').addEventListener('click', () => {
      pSel = []; genSecret(); drawPattern(); updatePatternUI(); vibrate(8);
    });

    // ---------- Init ----------
    document.querySelectorAll('#shapeBar .chip').forEach(b => b.classList.toggle('active', parseInt(b.dataset.arms) === arms));
    document.querySelectorAll('#themeBar .chip').forEach(b => b.classList.toggle('active', b.dataset.theme === theme));
    buildScroller();
    newMaze();
    genSecret();
    applyTheme();
    applyMode();
    requestAnimationFrame(tick);

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
